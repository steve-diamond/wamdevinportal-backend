services:
  - type: web
    name: wamdin-backend
    runtime: node
    plan: free
    buildCommand: npm install --production
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false          # Set this manually in Render → Environment
      - key: JWT_SECRET
        sync: false          # Set this manually in Render → Environment
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_URLS
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
